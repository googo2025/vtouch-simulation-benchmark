<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2 · 按压表面与相机变化</title><link rel="stylesheet" href="../style.css"><main><h2>A2 · 按压表面与相机变化</h2><p class="intro">选取已有V2四个区域的加载状态及其原参考。它是A/B共享的力学—光学示例；15种形貌的定量比较使用另一套资料。</p><div class="tools"><label>区域 <select id="state"></select></label><label>光照方向 <select id="tilt"><option>0</option><option>60</option></select>°</label><span class="chip">指令压入0.3毫米</span></div><p id="status"></p><canvas class="geo" id="geometry"></canvas><div class="tools"><label><input id="reference" type="checkbox" checked> 灰色原参考</label><label><input id="cut" type="checkbox"> 剖开</label><button id="reset">复位视角</button></div><p class="legend">青色为加载表面，灰色为原参考。点云仅作显示抽稀，各状态保留原坐标。</p><div class="tools"><label>图像显示增益 <select id="gain"><option>4</option><option selected>8</option><option>16</option></select></label><label>差分显示增益 <select id="diffGain"><option>32</option><option selected>128</option><option>512</option></select></label></div><p>点击任一图像，同步移动三个面板的160×160像素放大区域。光学数组保留1280×720原始分辨率。</p><div class="grid"><section><h3>未按压原参考</h3><canvas id="ref" style="aspect-ratio:16/9"></canvas><canvas class="zoom" id="refZoom"></canvas></section><section><h3>按压后观察</h3><canvas id="press" style="aspect-ratio:16/9"></canvas><canvas class="zoom" id="pressZoom"></canvas></section><section><h3>光学绝对差分</h3><canvas id="diff" style="aspect-ratio:16/9"></canvas><canvas class="zoom" id="diffZoom"></canvas></section></div><p id="pixel"></p><details><summary>来源身份与展示范围</summary><pre id="source"></pre></details></main><script src="../loaded.js"></script></html>
